name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Segurança, Produto, SEO, Acessibilidade, Lint, TypeScript e Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Procurar segredos versionados
        run: npm run security:check

      - name: Verificar dependências de produção
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verificar vulnerabilidades altas
        run: npm audit --audit-level=high

      - name: Auditar motor de geração
        run: npm run generator:check

      - name: Auditar promessas públicas
        run: npm run claims:check

      - name: Auditar SEO e links internos
        run: npm run seo:check

      - name: Executar lint
        run: npm run lint

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Validar build de produção
        run: npm run build
        env:
          DATABASE_URL: postgresql://anunciaai:anunciaai@127.0.0.1:5432/anunciaai

      - name: Smoke test de páginas, AdSense e proteções da API
        env:
          DATABASE_URL: postgresql://anunciaai:anunciaai@127.0.0.1:5432/anunciaai
        run: |
          npm run start -- -p 3000 > /tmp/anunciaai-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/anunciaai-next.log
            exit 1
          fi

          expect_status() {
            expected="$1"
            shift
            actual=$(curl --silent --output /dev/null --write-out '%{http_code}' "$@")
            if [ "$actual" != "$expected" ]; then
              echo "Status inesperado: esperado $expected, recebido $actual para curl $*"
              exit 1
            fi
          }

          HOME_HTML=$(curl --fail --silent --show-error http://127.0.0.1:3000/)
          printf '%s' "$HOME_HTML" | grep -Fq 'pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2381421388873161'

          ADS_TXT=$(curl --fail --silent --show-error http://127.0.0.1:3000/ads.txt)
          test "$ADS_TXT" = 'google.com, pub-2381421388873161, DIRECT, f08c47fec0942fa0'

          curl --fail --silent --show-error http://127.0.0.1:3000/robots.txt > /dev/null

          GENERATE_CAPABILITY=$(curl --fail --silent --show-error http://127.0.0.1:3000/api/generate)
          printf '%s' "$GENERATE_CAPABILITY" | grep -Fq '"enabled":false'
          expect_status 503 \
            -X POST \
            -H 'Origin: http://127.0.0.1:3000' \
            -H 'Content-Type: application/json' \
            --data '{}' \
            http://127.0.0.1:3000/api/generate

          expect_status 400 'http://127.0.0.1:3000/api/generations?cache=1'
          expect_status 400 'http://127.0.0.1:3000/api/health?cache=1'
          expect_status 403 \
            -X POST \
            -H 'Origin: https://example.org' \
            -H 'Content-Type: application/json' \
            --data '{"channel":"olx"}' \
            http://127.0.0.1:3000/api/generations
          expect_status 415 \
            -X POST \
            -H 'Content-Type: text/plain' \
            --data 'olx' \
            http://127.0.0.1:3000/api/generations
          expect_status 400 \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{invalid-json' \
            http://127.0.0.1:3000/api/generations
          expect_status 400 \
            -X POST \
            -H 'Content-Type: application/json' \
            --data '{"channel":"canal-inexistente"}' \
            http://127.0.0.1:3000/api/generations
          expect_status 400 \
            -X POST \
            -H 'Origin: http://127.0.0.1:3000' \
            -H 'Content-Type: application/json' \
            --data '{"channel":"olx","productName":"nao-deve-ser-enviado"}' \
            http://127.0.0.1:3000/api/generations

          {
            printf '{"channel":"olx","padding":"'
            head -c 2100 /dev/zero | tr '\0' 'a'
            printf '"}'
          } > /tmp/oversized.json
          expect_status 413 \
            -X POST \
            -H 'Origin: http://127.0.0.1:3000' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/oversized.json \
            http://127.0.0.1:3000/api/generations

          SITEMAP=$(curl --fail --silent --show-error http://127.0.0.1:3000/sitemap.xml)
          mapfile -t ROUTES < <(
            printf '%s' "$SITEMAP" \
              | grep -oE '<loc>[^<]+</loc>' \
              | sed -E 's#<loc>https://anunciaai\.vercel\.app([^<]*)</loc>#\1#'
          )

          if [ "${#ROUTES[@]}" -eq 0 ]; then
            echo "Nenhuma rota encontrada no sitemap."
            exit 1
          fi

          echo "Testando ${#ROUTES[@]} páginas públicas do sitemap"
          for route in "${ROUTES[@]}"; do
            if [ -z "$route" ]; then
              route="/"
            fi
            echo "GET $route"
            curl --fail --silent --show-error "http://127.0.0.1:3000$route" > /dev/null
          done

          BASE_URL=http://127.0.0.1:3000 npm run runtime:check
          BASE_URL=http://127.0.0.1:3000 npm run a11y:check
