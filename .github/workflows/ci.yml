name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Segurança, SEO, Lint, TypeScript e Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Verificar vulnerabilidades altas
        run: npm audit --audit-level=high

      - name: Auditar SEO e links internos
        run: npm run seo:check

      - name: Executar lint
        run: npm run lint

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Validar build de produção
        run: npm run build
        env:
          DATABASE_URL: postgresql://anunciaai:anunciaai@127.0.0.1:5432/anunciaai
