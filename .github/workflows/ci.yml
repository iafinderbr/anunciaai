name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Segurança, SEO, Lint, TypeScript e Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Verificar vulnerabilidades altas
        run: npm audit --audit-level=high

      - name: Auditar SEO e links internos
        run: npm run seo:check

      - name: Executar lint
        run: npm run lint

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Validar build de produção
        run: npm run build
        env:
          DATABASE_URL: postgresql://anunciaai:anunciaai@127.0.0.1:5432/anunciaai

      - name: Smoke test de todas as páginas públicas
        env:
          DATABASE_URL: postgresql://anunciaai:anunciaai@127.0.0.1:5432/anunciaai
        run: |
          npm run start -- -p 3000 > /tmp/anunciaai-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/anunciaai-next.log
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:3000/robots.txt > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:3000/ads.txt > /dev/null

          SITEMAP=$(curl --fail --silent --show-error http://127.0.0.1:3000/sitemap.xml)
          mapfile -t ROUTES < <(
            printf '%s' "$SITEMAP" \
              | grep -oE '<loc>[^<]+</loc>' \
              | sed -E 's#<loc>https://anunciaai\.vercel\.app([^<]*)</loc>#\1#'
          )

          if [ "${#ROUTES[@]}" -eq 0 ]; then
            echo "Nenhuma rota encontrada no sitemap."
            exit 1
          fi

          echo "Testando ${#ROUTES[@]} páginas públicas do sitemap"
          for route in "${ROUTES[@]}"; do
            if [ -z "$route" ]; then
              route="/"
            fi
            echo "GET $route"
            curl --fail --silent --show-error "http://127.0.0.1:3000$route" > /dev/null
          done
