name: Segurança do backend generativo

on:
  push:
    branches: [main]
    paths:
      - "src/app/api/generate/**"
      - "src/lib/gemini-provider.ts"
      - "scripts/generative-security-check.mjs"
      - ".github/workflows/generative-security.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/app/api/generate/**"
      - "src/lib/gemini-provider.ts"
      - "scripts/generative-security-check.mjs"
      - ".github/workflows/generative-security.yml"

permissions:
  contents: read

jobs:
  guard:
    name: Validar proteções do provedor
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Baixar repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Auditar integração
        run: node scripts/generative-security-check.mjs
