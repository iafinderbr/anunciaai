name: Atualizar dependencias de seguranca

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-security-deps:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Mostrar versoes estaveis atuais
        run: |
          echo "Next latest: $(npm view next version)"
          echo "eslint-config-next latest: $(npm view eslint-config-next version)"
          echo "PostCSS latest: $(npm view postcss version)"

      - name: Atualizar dependencias de seguranca
        run: |
          npm install next@latest --save-exact --no-audit --no-fund
          npm install --save-dev eslint-config-next@latest postcss@latest --save-exact --no-audit --no-fund

      - name: Verificar vulnerabilidades altas
        run: npm audit --audit-level=high

      - name: Validar projeto
        run: |
          npm run lint
          npm run typecheck

      - name: Salvar package-lock atualizado
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: atualiza dependencias criticas"
          git push
