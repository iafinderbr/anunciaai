name: Bootstrap Better Auth dependency

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-better-auth.yml

permissions:
  contents: write

jobs:
  update-dependencies:
    name: Adicionar Better Auth e adapter Drizzle ao lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Atualizar package.json e package-lock.json
        run: npm install better-auth@1.6.25 @better-auth/drizzle-adapter@1.6.25 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commitar dependências
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Better Auth e adapter já estão registrados."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: adiciona Better Auth e adapter Drizzle"
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" push origin HEAD:main
