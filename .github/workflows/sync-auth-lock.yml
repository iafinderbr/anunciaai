name: Sync auth lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-lockfile:
    name: Sincronizar package-lock
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/account-header'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Baixar branch do PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/account-header
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Atualizar lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commitar lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json já está sincronizado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: sincroniza lockfile da autenticação"
          BASIC_AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${BASIC_AUTH}" push origin HEAD:feature/account-header
